<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Articles, annonces et actualites du serveur Minecraft ZYRANEX."
        />

        <title>Articles - ZYRANEX</title>

        <link
            rel="icon"
            type="image/png"
            sizes="48x48"
            href="/assets/images/brand/favicon-48x48.png"
        />
        <link rel="icon" type="image/x-icon" href="/assets/images/brand/favicon.ico" />
        <link rel="icon" type="image/webp" href="/assets/images/brand/zyranex-48x48.webp" />
        <link
            rel="icon"
            type="image/webp"
            sizes="16x16"
            href="/assets/images/brand/zyranex-16x16.webp"
        />
        <link
            rel="icon"
            type="image/webp"
            sizes="32x32"
            href="/assets/images/brand/zyranex-32x32.webp"
        />
        <link
            rel="icon"
            type="image/webp"
            sizes="48x48"
            href="/assets/images/brand/zyranex-48x48.webp"
        />
        <link rel="apple-touch-icon" href="/assets/images/brand/favicon-48x48.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/assets/css/styles.css?v=5" />
    </head>

    <body>
        <header>
            <div class="container header-inner">
                <a href="/" class="brand" aria-label="ZYRANEX">
                    <img src="/assets/images/brand/zyranex.webp" alt="ZYRANEX" class="brand-logo" />
                </a>
                <button
                    class="menu-toggle"
                    type="button"
                    aria-label="Menu"
                    aria-expanded="false"
                    aria-controls="main-nav"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav id="main-nav">
                    <a href="/">Accueil</a>
                    <a href="/#mini-games">Mini-jeux</a>
                    <a href="/articles/" class="active">Articles</a>
                    <a
                        href="https://status.zyranex.fr/"
                        target="_blank"
                        rel="noopener noreferrer"
                        >Statut</a
                    >
                    <a href="/credits/">Crédits</a>
                    <a
                        href="https://discord.gg/rf8AcQwdMJ"
                        target="_blank"
                        rel="noopener"
                        >Discord</a
                    >
                </nav>
            </div>
        </header>

        <main>
            <section class="hero hero-sm articles-hero" id="articles">
                <div class="container">
                    <p class="kicker">// ARTICLES // ANNONCES</p>
                    <h1 class="hero-title">ARTICLES</h1>
                    <p class="hero-text">
                        Les nouvelles du serveur, les patch notes, les
                        recrutements et les temps forts de la communauté.
                    </p>
                </div>
            </section>

            <section class="section article-index-section">
                <div class="container">
                    <div class="article-search-panel">
                        <label class="article-search-label" for="article-search"
                            >Rechercher un article</label
                        >
                        <input
                            class="article-search-input"
                            id="article-search"
                            type="search"
                            placeholder="Titre, catégorie, auteur..."
                            autocomplete="off"
                            data-article-search
                        />
                        <p class="article-count" data-article-count>
                            Chargement des articles...
                        </p>
                    </div>

                    <div
                        class="article-grid article-grid-full"
                        data-article-list
                        data-empty="Aucun article ne correspond a cette recherche."
                    ></div>
                </div>
            </section>
        </main>

        <footer>
            <div class="container footer-inner">
                <div class="footer-copy">
                    <span>ZYRANEX // 2026</span>
                    <span class="footer-meta"
                        >Fait pour les joueurs, par des joueurs.</span
                    >
                </div>
                <div
                    class="footer-links"
                    role="navigation"
                    aria-label="Liens légaux"
                >
                    <a href="/terms/">Conditions</a>
                    <a href="/privacy/">Confidentialité</a>
                </div>
            </div>
        </footer>

        <script src="/assets/js/script.js?v=5"></script>
    </body>
</html>
