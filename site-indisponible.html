<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyranex • Indisponible</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-box">
        <img src="assets/images/brand/zyranex-48x48.webp" alt="logo">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>
</div>

<!-- PAGE -->
<main id="main">
    <div class="card">

        <div class="logo">
            <img src="assets/images/brand/zyranex-48x48.webp" alt="Zyranex logo">
        </div>

        <h1>Zyranex</h1>

        <div class="status">
            ⚠ Service temporairement indisponible
        </div>

        <p>
            Nos équipes effectuent actuellement une maintenance afin
            d’améliorer la stabilité et les performances du service.
        </p>

        <div class="badge">
            Revenez plus tard
        </div>

    </div>
</main>

<script>
setTimeout(() => {
    document.getElementById("loader").style.opacity = "0";

    setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        document.getElementById("main").classList.add("show");
    }, 500);

}, 3000);
</script>

</body>
</html>
