<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyranex Network - Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* Insertion de ta charte graphique Zyranex exacte */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a0f08;
            --bg-alt: #261a10;
            --bg-deep: #120a05;
            --line: #3a2818;
            --line-strong: #5a3a22;
            --text: #fff5dc;
            --text-dim: #c9a878;
            --gold: #ffcc33;
            --gold-light: #ffe082;
            --gold-deep: #f5a623;
            --orange: #e87f1a;
            --brown: #4a1f0a;
            --brown-deep: #2b1003;
            --accent: #ffcc33;
            --accent-2: #ff8a1f;
            --ok: #8bc34a;
            --warn: #ffaa00;
            --err: #ff5555;
            --pix: "Press Start 2P", monospace;
            --mono: "VT323", "IBM Plex Mono", Consolas, monospace;
            --ease-smooth-out: cubic-bezier(0.16, 1, 0.3, 1);

            --r-sm: 6px;
            --r-md: 12px;
            --r-lg: 18px;
            --r-xl: 24px;
            --r-pill: 999px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body {
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255, 204, 51, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 90% 100%, rgba(232, 127, 26, 0.12) 0%, transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            padding-top: 78px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 204, 51, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 204, 51, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            background-position: -1px -1px;
            pointer-events: none;
            z-index: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        main {
            animation: pageEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
            will-change: opacity, transform;
            padding: 60px 0;
        }

        @keyframes pageEnter {
            0% { opacity: 0; transform: translateY(14px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* ----- HEADER ----- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(18, 10, 5, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--line);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s ease;
        }

        .brand:hover { transform: translateY(1px); }

        .brand-text {
            font-family: var(--pix);
            font-size: 14px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 var(--brown-deep);
        }

        nav { display: flex; gap: 4px; }

        nav a {
            font-family: var(--pix);
            font-size: 10px;
            color: var(--text-dim);
            padding: 10px 14px;
            border: 2px solid transparent;
            border-radius: var(--r-md);
            transition: all 0.2s ease;
            letter-spacing: 1.5px;
        }

        nav a:hover {
            color: var(--gold-light);
            border-color: rgba(255, 204, 51, 0.5);
            background: rgba(255, 204, 51, 0.08);
            transform: translateY(2px);
        }

        nav a.active {
            color: var(--brown-deep);
            background: var(--gold);
            border-color: var(--gold-deep);
            box-shadow: 0 3px 0 var(--brown);
        }

        /* ----- STATUS COMPONENT (Style Legal/Panel) ----- */
        .status-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .status-title {
            font-family: var(--pix);
            font-size: 36px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 4px 4px 0 var(--brown-deep);
            margin-bottom: 12px;
        }

        .status-subtitle {
            color: var(--text-dim);
            font-size: 22px;
        }

        .legal-panel {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid var(--line-strong);
            border-radius: var(--r-lg);
            background: linear-gradient(180deg, rgba(38, 26, 16, 0.92) 0%, rgba(18, 10, 5, 0.96) 100%);
            overflow: hidden;
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 204, 51, 0.08);
        }

        .legal-row {
            display: grid;
            grid-template-columns: 58px 1fr;
            gap: 22px;
            padding: 28px;
            border-bottom: 1px dashed var(--line-strong);
            align-items: center;
        }

        .legal-row:last-of-type { border-bottom: none; }

        .legal-num {
            font-family: var(--pix);
            font-size: 12px;
            color: var(--gold);
            letter-spacing: 1.5px;
        }

        .status-details h2 {
            font-family: var(--pix);
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 1.4px;
            margin-bottom: 6px;
        }

        .status-details p {
            color: var(--text-dim);
            font-size: 22px;
        }

        /* ----- SYSTEME DE POINT CLIGNOTANT ----- */
        .status-value {
            font-family: var(--pix);
            font-size: 11px;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: var(--warn);
            border-radius: 2px;
            box-shadow: 0 0 0 2px var(--bg-alt), 0 0 0 4px var(--warn), 0 0 10px var(--warn);
            animation: blink 1.6s ease-in-out infinite;
        }

        .dot.online {
            background: var(--ok);
            box-shadow: 0 0 0 2px var(--bg-alt), 0 0 0 4px var(--ok), 0 0 10px var(--ok);
        }

        .dot.offline {
            background: var(--err);
            box-shadow: 0 0 0 2px var(--bg-alt), 0 0 0 4px var(--err), 0 0 10px var(--err);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ----- FOOTER ----- */
        footer {
            border-top: 2px solid var(--line);
            padding: 26px 0;
            background: var(--bg-deep);
            margin-top: auto;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--pix);
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-meta { color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="header-inner">
                <a href="https://zyranex.fr/" class="brand">
                    <span class="brand-text">ZYRANEX.FR</span>
                </a>
                <nav>
                    <a href="https://zyranex.fr/">ACCUEIL</a>
                    <a href="https://status.zyranex.fr/" class="active">STATUS</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="status-hero">
            <h1 class="status-title">STATUS DU NETWORK</h1>
            <p class="status-subtitle">Suivi en temps réel de nos infrastructures de jeu.</p>
        </div>

        <div class="legal-panel">
            <div class="legal-row">
                <div class="legal-num">01</div>
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 15px;">
                    <div class="status-details">
                        <h2>SERVEUR DE JEU</h2>
                        <p id="server-ip-display">play.zyranex.fr</p>
                    </div>
                    <div class="status-value">
                        <span id="status-text">CONNEXION...</span>
                        <div id="status-dot" class="dot"></div>
                    </div>
                </div>
            </div>

            <div class="legal-row">
                <div class="legal-num">02</div>
                <div class="status-details">
                    <h2>JOUEURS EN LIGNE</h2>
                    <p id="player-count">- / -</p>
                </div>
            </div>

            <div class="legal-row">
                <div class="legal-num">03</div>
                <div class="status-details">
                    <h2>VERSION DU SERVEUR</h2>
                    <p id="server-version">-</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-inner">
            <div>&copy; 2026 ZYRANEX NETWORK. TOUS DROITS RÉSERVÉS.</div>
            <div class="footer-meta">STATUS SYSTEM v1.0</div>
        </div>
    </footer>

    <script>
        // Liaison avec tes données de domaine
        const SERVER_IP = "play.zyranex.fr";
        const SERVER_PORT = "28849";

        async function checkServerStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const players = document.getElementById('player-count');
            const version = document.getElementById('server-version');

            try {
                const response = await fetch(`https://api.mcsrvstat.us/2/${SERVER_IP}:${SERVER_PORT}`);
                const data = await response.json();

                if (data.online) {
                    text.textContent = "EN LIGNE";
                    text.style.color = "var(--ok)";
                    dot.className = "dot online";
                    players.textContent = `${data.players.online} / ${data.players.max}`;
                    version.textContent = data.version ? data.version.toUpperCase() : "ACTUELLE";
                } else {
                    setOffline();
                }
            } catch (error) {
                console.error("Erreur API de statut :", error);
                setOffline();
            }
        }

        function setOffline() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const players = document.getElementById('player-count');
            const version = document.getElementById('server-version');
            
            text.textContent = "HORS LIGNE";
            text.style.color = "var(--err)";
            dot.className = "dot offline";
            players.textContent = "0 / 0";
            version.textContent = "INACCESSIBLE";
        }

        // Démarrage initial et rafraîchissement toutes les 30 secondes
        checkServerStatus();
        setInterval(checkServerStatus, 30000);
    </script>
</body>
</html>
