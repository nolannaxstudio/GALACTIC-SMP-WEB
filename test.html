<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyranex Network - Status</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #16161f;
            --accent-color: #7289da; /* Couleur principale (style Discord/Gaming) */
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --online-color: #10b981;
            --offline-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100ve;
            align-items: center;
        }

        /* Navbar / Header */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        /* Carte du Serveur */
        .status-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .server-name {
            font-size: 20px;
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* États du badge */
        .status-badge.online {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--online-color);
        }
        .status-badge.online::before { background-color: var(--online-color); }

        .status-badge.offline {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--offline-color);
        }
        .status-badge.offline::before { background-color: var(--offline-color); }

        .status-badge.loading {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        /* Infos détaillées */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZYRANEX<span>.FR</span></div>
        <div class="nav-links">
            <a href="https://zyranex.fr/">Accueil</a>
            <a href="#" style="color: #fff;">Status</a>
        </div>
    </header>

    <div class="container">
        <h1>Statut du Network</h1>
        <p class="subtitle">Vérifiez en temps réel l'état de nos infrastructures.</p>

        <div class="status-card">
            <div class="card-header">
                <div>
                    <div class="server-name">Serveur Principal</div>
                    <div style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">91.197.6.166:28849</div>
                </div>
                <div id="status-indicator" class="status-badge loading">Connexion...</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Joueurs</div>
                    <div id="player-count" class="info-value">- / -</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Version</div>
                    <div id="server-version" class="info-value">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Type</div>
                    <div id="server-type" class="info-value">Jeux</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Zyranex Network. Tous droits réservés.
    </footer>

    <script>
        // Configuration de l'IP du serveur (Le script utilise une API de ping générique)
        const SERVER_IP = "91.197.6.166";
        const SERVER_PORT = "28849";

        async function checkServerStatus() {
            const indicator = document.getElementById('status-indicator');
            const players = document.getElementById('player-count');
            const version = document.getElementById('server-version');

            try {
                // Utilisation de l'API mcapis.com (marche très bien pour Minecraft/les requêtes de base, adaptable selon le jeu)
                // Si c'est un serveur Rust/Garry's Mod/etc., on utilise une API globale comme-ci dessous :
                const response = await fetch(`https://api.mcsrvstat.us/2/${SERVER_IP}:${SERVER_PORT}`);
                const data = await response.json();

                if (data.online) {
                    indicator.textContent = "En ligne";
                    indicator.className = "status-badge online";
                    players.textContent = `${data.players.online} / ${data.players.max}`;
                    version.textContent = data.version ? data.version : "Actuelle";
                } else {
                    setOffline();
                }
            } catch (error) {
                console.error("Erreur lors de la récupération du statut :", error);
                setOffline();
            }
        }

        function setOffline() {
            const indicator = document.getElementById('status-indicator');
            const players = document.getElementById('player-count');
            const version = document.getElementById('server-version');
            
            indicator.textContent = "Hors ligne";
            indicator.className = "status-badge offline";
            players.textContent = "0 / 0";
            version.textContent = "Inaccessible";
        }

        // Exécuter la vérification au chargement, puis toutes les 30 secondes
        checkServerStatus();
        setInterval(checkServerStatus, 30000);
    </script>
</body>
</html>
